<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0E1014">
    <title>Upload · JanManch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="topbar" class="topbar"></header>
<div class="layout">
    <nav id="sidebar" class="sidebar"></nav>
    <main id="content" class="content">
        <form id="upload-form" class="form-card panel" novalidate>
            <h1>Upload a video</h1>
            <div class="muted">MP4, WebM or MOV, up to 500 MB. Processing starts as soon as the upload finishes.</div>

            <label id="dropzone" class="dropzone" for="file">
                <span class="icon-circle">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>
                </span>
                <strong>Drag and drop a video here</strong>
                <span class="muted small">or click to choose a file</span>
            </label>
            <input id="file" type="file" accept="video/*" class="sr-only">
            <div id="file-picked" class="file-picked" hidden>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>
                <span id="file-name" class="name"></span>
                <span id="file-size" class="muted small"></span>
                <button id="file-clear" type="button" class="link-btn">Change</button>
            </div>

            <div class="field">
                <label for="title">Title</label>
                <input id="title" type="text" maxlength="200" required>
                <span id="title-count" class="hint">0 / 200</span>
            </div>
            <div class="field">
                <label for="description">Description</label>
                <textarea id="description" maxlength="5000" placeholder="Tell viewers about your video. Chapter times like 2:40 work well here."></textarea>
            </div>
            <div class="field">
                <label for="tags">Tags</label>
                <input id="tags" type="text" placeholder="music, travel, cricket">
                <span class="hint">Separate with commas. Up to 10 tags; viewers can search by them.</span>
            </div>

            <div id="progress-box" hidden style="margin-top: 22px;">
                <div class="row" style="justify-content: space-between; margin-bottom: 8px;">
                    <strong id="progress-label">Uploading…</strong>
                    <span id="progress-percent" class="muted small">0%</span>
                </div>
                <div class="progress" role="progressbar" aria-labelledby="progress-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress">
                    <div id="progress-bar" class="bar"></div>
                </div>
            </div>
            <div id="message" class="form-message" role="alert"></div>

            <div class="form-actions">
                <a href="/studio.html" class="btn">Cancel</a>
                <button id="submit" type="submit" class="btn primary">Upload</button>
            </div>
        </form>
    </main>
</div>
<nav id="bottom-nav" class="bottom-nav"></nav>

<script src="/js/app.js"></script>
<script>
    if (requireLogin()) {
        renderShell(null);

        const MAX_BYTES = 500 * 1024 * 1024;
        const fileInput = $("#file");
        const dropzone = $("#dropzone");
        const title = $("#title");
        let file = null;

        function formatSize(bytes) {
            if (bytes >= 1024 * 1024 * 1024) return (bytes / 1024 / 1024 / 1024).toFixed(1) + " GB";
            if (bytes >= 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + " MB";
            return Math.ceil(bytes / 1024) + " KB";
        }

        function showMessage(text, isError) {
            $("#message").className = "form-message " + (isError ? "error-text" : "muted");
            $("#message").textContent = text;
        }

        function pick(chosen) {
            if (!chosen) return;
            if (!chosen.type.startsWith("video/")) { showMessage("That file isn't a video. Choose an MP4, WebM or MOV file.", true); return; }
            if (chosen.size > MAX_BYTES) { showMessage("That file is " + formatSize(chosen.size) + ". The limit is 500 MB.", true); return; }
            file = chosen;
            showMessage("");
            $("#file-name").textContent = file.name;
            $("#file-size").textContent = formatSize(file.size);
            $("#file-picked").hidden = false;
            dropzone.hidden = true;
            if (!title.value.trim()) {
                title.value = file.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").trim().slice(0, 200);
                title.dispatchEvent(new Event("input"));
            }
        }

        fileInput.addEventListener("change", () => pick(fileInput.files[0]));
        $("#file-clear").addEventListener("click", () => {
            file = null;
            fileInput.value = "";
            $("#file-picked").hidden = true;
            dropzone.hidden = false;
            fileInput.click();
        });

        ["dragenter", "dragover"].forEach(type => dropzone.addEventListener(type, event => {
            event.preventDefault();
            dropzone.classList.add("dragging");
        }));
        ["dragleave", "drop"].forEach(type => dropzone.addEventListener(type, event => {
            event.preventDefault();
            dropzone.classList.remove("dragging");
        }));
        dropzone.addEventListener("drop", event => pick(event.dataTransfer.files[0]));

        title.addEventListener("input", () => { $("#title-count").textContent = title.value.length + " / 200"; });

        function setProgress(percent, label) {
            $("#progress-box").hidden = false;
            $("#progress-bar").style.width = percent + "%";
            $("#progress").setAttribute("aria-valuenow", String(percent));
            $("#progress-percent").textContent = percent + "%";
            if (label) $("#progress-label").textContent = label;
        }

        $("#upload-form").addEventListener("submit", event => {
            event.preventDefault();
            if (!file) { showMessage("Choose a video file first.", true); return; }
            if (!title.value.trim()) { showMessage("Add a title.", true); title.focus(); return; }

            const form = new FormData();
            form.append("file", file);
            form.append("title", title.value.trim());
            form.append("description", $("#description").value);
            form.append("tags", $("#tags").value);

            // XMLHttpRequest instead of fetch, because it reports upload progress.
            const xhr = new XMLHttpRequest();
            xhr.open("POST", "/videos");
            xhr.setRequestHeader("Authorization", "Bearer " + getToken());
            xhr.upload.addEventListener("progress", e => {
                if (e.lengthComputable) setProgress(Math.round((e.loaded / e.total) * 100), "Uploading…");
            });
            xhr.addEventListener("load", () => {
                let data = null;
                try { data = JSON.parse(xhr.responseText); } catch (e) { /* not JSON */ }
                if (xhr.status === 201) {
                    setProgress(100, "Uploaded. Processing has started.");
                    showMessage("Taking you to your studio…");
                    setTimeout(() => { location.href = "/studio.html"; }, 1200);
                } else if (xhr.status === 401) {
                    clearLogin();
                    location.href = loginUrl();
                } else {
                    $("#submit").disabled = false;
                    showMessage((data && data.message) || "Upload failed (" + xhr.status + ").", true);
                }
            });
            xhr.addEventListener("error", () => {
                $("#submit").disabled = false;
                showMessage("The upload was interrupted. Check your connection and try again.", true);
            });
            $("#submit").disabled = true;
            setProgress(0, "Uploading…");
            showMessage("");
            xhr.send(form);
        });
    }
</script>
</body>
</html>
